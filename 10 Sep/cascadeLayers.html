<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @layer base ,special ,back;
        @layer base {
            .para{
                font-size: 20px;
                color: red;
            }
        }
        @layer special{
            .para2{
                font-size: 50px;
                color: blue;
            }
        }
        @layer back{
            body{
                background-color: yellow;
            }
        }
        /* #para {
            color: blue;
        }
        p{
            color: red;
        } */
    </style>
</head>
<body>
    <p class="para para2">This is a sample paragraph in the HTML document.</p>  
</body>
</html>

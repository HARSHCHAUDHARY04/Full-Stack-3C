<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body{
            height: 100%;
            width: 100%;
        }
        .main{
            display: grid;
            height:500px;
            width: 500px;
            background-color: yellow;
            grid-template-columns: repeat(5, 1fr);
        }
        .one{
            background-color: red;
            height: 100px;
            width: 100px;
        }
        .two{
            background-color: green;
            height: 100px;
            width: 100px;
        }
        .three{
            background-color: blue;
            height: 100px;
            width: 100px;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="one">A</div>
        <div class="two">B</div>
        <div class="three">C</div>
        <div class="three">D</div>
        <div class="three">E</div>
    </div>
</body>
</html>
